; [Debug]
; Debug=1 in HorizonUI.user.ini is a diagnostic switch. It is not part of this look.
; In an xmake debug build of HorizonUI.dll (HZ_COMMS_MSG_LOG=1) and a Comms movie with
; HZC_MSG_LOG set true, Debug=1 copies HUD message text, including lines from other
; interface files, into HorizonUI.log as "comms msg:" lines.
; The no-debug build (xmake releasedbg, the test DLL) compiles that writer out, and
; the Comms movie in this build keeps HZC_MSG_LOG false, so Debug=1 does not write those lines.
