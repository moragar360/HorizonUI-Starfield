[Preset]
Name=Moragar's Choice
Author=Moragar
Version=0.43.1.0
Description=The author's own settings, matching the Nexus screenshots.

[Style]
AccentColor=9
CardColor=1
HudScale=0.8
HoverScale=0.7
TextShadow=1
CardBgOpacity=92
SettingsOpacity=93
CardShadow=12

[Cards]
; Name hover: 0 = compact one-line pill (default), 1 = the full card
NameHover=0
; Health and oxygen: 0 = full cards (default), 1 = the COMPACT MODE card (boost, health, and oxygen together)
VitalsBars=0
StealthScale=1.15
VitalsLayout=1

[Layout]
JetpackX=R10
JetpackY=B128
VitalsX=C-5
VitalsY=B-14
AfflictionsX=C-287
AfflictionsY=B12
CharacterX=L-10
CharacterY=B-10
EnemyX=C-10
EnemyY=T140
StealthX=C-3
StealthY=C127
XpToastX=C-182
XpToastY=C-104
SubtitleX=C30
SubtitleY=B212
DialogueX=R-30
DialogueY=C-39
MissionToastX=R172
MissionToastY=T100
HudMessagesX=R-10
HudMessagesY=T180
ArrangeBarX=-292
ArrangeBarY=-183

[Comms]
SubSize=0.95
SubWidth=30
SubTextColor=9
SubCard=0
SpeakerColor=10
