; Horizon UI - HUD module settings: HorizonUI.default.ini (v0.42.0) = every setting at its default.
; This file is replaced by every update - do not edit it. Your own values live in HorizonUI.user.ini
; (written by F11, only what differs from here). 1 = on, 0 = off.

[Hotkeys]
; Settings menu key (needs the Horizon SFSE helper). Default F11. Takes effect after restart. F11 opens from the main HUD only (not while the scanner or a full-screen menu is open).
SettingsKey=F11

[Cards]
; Card on/off. When each card shows is set in [Rules].
ShowJetpack=1
ShowVitals=1
ShowPlanet=1
ShowAfflictions=1
ShowAmmo=1
ShowQuests=1
ShowCompass=1
; Vehicle exit prompt: 1 = Horizon pill (the key the game shows, EXIT, a hold sweep). 0 = the game's prompt.
VehicleExitPill=1
; Planet pill: extra system / gravity line
PlanetDetails=0
; Target card (restyled activate prompt). 0 = vanilla prompt untouched. Scanner / inventory prompts always stay vanilla
ShowTarget=1
; Target anchor: 0 crosshair (frames the game's button bar), 1 follow the target on screen
TargetAnchor=0
TargetShowValue=1
; ShowAmmo = the EQUIPMENT card (always the v0.26 layout: A normally, C in compact mode)
; v0.34 card size: -1 = GLOBAL ([Style] HudScale), 0.60 - 1.60 = CUSTOM (this card's own size; HudScale no longer applies to it)
; CompactScale = the compact strips card. Hover / container sizes are [Style] HoverScale / ContainerScale
JetpackScale=-1
VitalsScale=-1
CharacterScale=-1
XpToastScale=-1
PlanetScale=-1
AfflictionsScale=-1
EquipmentScale=-1
QuestsScale=-1
CompassScale=-1
EnemyScale=-1
StealthScale=-1
CompactScale=-1
; v0.42 vitals card layout: 0 = vertical (health above O2, default), 1 = horizontal (O2 beside health, one row); F11 > CARDS or ARRANGE CARDS (L)
VitalsLayout=0
; v0.34 card compact form: -1 = GLOBAL ([Style] Compact), 0 off, 1 on. Jetpack / vitals / afflictions follow the global Compact
CharacterCompact=-1
PlanetCompact=-1
EquipmentCompact=-1
QuestsCompact=-1
CompassCompact=-1

[Compass]
; Master switch for markers on the Horizon compass (quest objectives always show when on)
CompassMarkers=1
ShowFollowers=1
ShowLocations=1
ShowShip=1
ShowEnemies=1
ShowPlayerMarker=1
; Follower / companion marker color: 0 bright green (#5CFF7A), 1 lime, 2 gold, 3 pink, 4 white, 5 mint (pre-v0.27)
FollowerColor=0

[Style]
; Card opacity 0.2 - 1.6 (above 1.0: fully opaque, then darker on dark cards / brighter on light cards)
CardOpacity=1.0
; Container / crosshair card opacity 0.2 - 1.6 (target tag, container list, item card); CardOpacity is for the HUD cards
ContainerOpacity=1.0
; 0 cyan, 1 teal, 2 amber, 3 violet, 4 lime, 5 white, 6 rose, 7 orange, 8 sky, 9 gold, 10 mint, 11 steel, 12 deep blue, 13 custom (AccentHex)
AccentColor=0
; Optional custom accent, e.g. AccentHex=#FF8800 (leave empty for none)
AccentHex=
; Card background: 0 slate, 1 graphite, 2 navy, 3 deep teal, 4 plum, 5 crimson, 6 storm gray,
;   7 light gray, 8 white, 9 pale blue, 10 pale amber, 11 pale mint, 12 custom (CardHex). Light cards use dark text.
CardColor=0
; Optional custom card color, e.g. CardHex=#E8ECEF (leave empty for none)
CardHex=
; Size of all Horizon cards 0.7 - 1.4
HudScale=1.0
SmoothBars=1
FadeCards=1
CombatDim=1
; Opacity of cards out of combat when CombatDim=1
DimOpacity=0.6
HazardAlert=1
Compact=0
; Distance of cards from the screen edges (20 - 200). Every card follows it: default spots sit this far in, cards moved
;   in ARRANGE CARDS keep their distance from this line at their nearest edge. The compass top follows it too.
Margin=40
; Text tone: 0 auto (dark text on light cards), 1 always light text, 2 always dark text
TextTone=0
; Font: 1 Exo 2 (default), 2 Roboto, 0 game font, 3 game font semibold (built into the game, nothing to install). Exo 2 / Roboto need Interface/fonts_horizon.swf + fontconfig; the game font is used if missing
FontFace=1
; Planet card time: 0 off, 1 LOCAL planet time (GAME hh:mm UT where there is no local day), 2 PC clock, 3 both
TimeDisplay=3
; Clock format for LOCAL and PC: 0 12-hour (AM/PM), 1 24-hour (GAME UT is always 24-hour, like the game)
ClockFormat=0
; Afflictions: 0 column of chips, 1 row, 2 icons only
AfflictionLayout=0
; Size of all Horizon text 0.8 - 1.3 (on top of HudScale)
TextScale=1.0
; Size of the container window (full item list): -1 = GLOBAL (HudScale), 0.60 - 1.60 = its own size (v0.34; set in F11 > CARDS)
ContainerScale=1.125
; Size of the hover cards (activate prompt, loose item / take card, compare, enemy tag): -1 = GLOBAL, 0.60 - 1.60
HoverScale=1
; Your vertical screen resolution (e.g. 1440) so crosshair cards snap to whole pixels; 0 = off
ScreenHeight=0
; Crosshair while aiming at something you can use: 0 vanilla ring, 1 Horizon dot, 2 Horizon cross, 3 none
CrosshairStyle=1
; Ring + leader line around the object you look at: 0 off, 1 container lists only, 2 vanilla
ObjectRing=0
; Card titles: 0 CAPS + letter-spaced, 1 Title Case with tight spacing
HeaderStyle=0
; Hard 1px text shadow (no blur). 0 = off (sharpest, default), 1 = on (helps over bright scenery)
TextShadow=0

[Cards Extra]
; Character card: name, LV + XP bar, skill points, credits, mass / overweight (strip in compact mode)
ShowCharacter=1
; Enemy health bar at the top center (LV, name, %, legendary stars / modifiers, EM / stunned). Hides the vanilla bar.
EnemyBar=1
; Stealth pill above the crosshair while sneaking. Hides the vanilla stealth meter.
StealthMeter=1
; Equipment card: grenade count + selected Starborn power (icon, meter). Hides the vanilla grenade / power readout.
EquipmentExtras=1

[Effects]
; Screen-edge tint pulsing ~1 Hz: red below 15% health, amber below 15% oxygen (center untouched)
EdgePulse=1
; +N XP toast beside the character card for ~2 s (gains close together are summed). With the Comms module the game's own +XP popup is hidden while this is on
XpToast=1
; Hit marker + kill X at the crosshair (hides the vanilla markers)
HitMarkers=1
; Floating damage numbers (white, CRIT amber, EM blue, RESIST gray; hides the vanilla numbers)
DamageNumbers=1
; Damage direction ring around the crosshair (hides the vanilla arcs)
DirectionRing=1
; Green healing sliver ahead of the health bar while health regenerates
RegenSliver=1

[Rules]
; One rule per card - when it shows:
;   0 always, 1 combat only, 2 hide in ship, 3 weapon drawn only (Equipment),
;   4 in use / not full (Jetpack), 5 HP or O2 below 100% (Vitals), 6 only when afflicted (Afflictions)
;   Character card: 0 always, 7 on XP / level up / credits / skill point (then fades), 8 when overweight, 9 7 or 8, 1, 2
; Replaces the old JetpackAutoHide / AfflictionsAutoHide / AmmoOnlyWhenDrawn keys (AmmoRule = Equipment card).
RulesVersion=2
JetpackRule=4
VitalsRule=0
PlanetRule=0
AfflictionsRule=6
AmmoRule=3
QuestsRule=0
CompassRule=0
CharacterRule=0
; Seconds the character card stays after an XP / level / credits event (rules 7 and 9), 2 - 60
CharacterShowSeconds=8
; Vitals slide to the exact center when the Equipment card is hidden (ignored if the vitals card was moved)
AutoCenterVitals=1

[Layout]
; Card positions from ARRANGE CARDS, anchored to the nearest edge (v0.30): X = L / R / C + offset, Y = T / B / C + offset,
;   offset in 1080p units from the Screen Margin line (C = from the screen center). -1 = default spot.
;   Old 0-1 fractions are still read and converted on the next save.
JetpackX=-1
JetpackY=-1
VitalsX=-1
VitalsY=-1
PlanetX=-1
PlanetY=-1
AfflictionsX=-1
AfflictionsY=-1
AmmoX=-1
AmmoY=-1
QuestsX=-1
QuestsY=-1
CompassX=-1
CompassY=-1
CompactX=-1
CompactY=-1
CharacterX=-1
CharacterY=-1
EnemyX=-1
EnemyY=-1
StealthX=-1
StealthY=-1
XpToastX=-1
XpToastY=-1
SubtitleX=-1
SubtitleY=-1
SpeakerX=-1
SpeakerY=-1
DialogueX=-1
DialogueY=-1
MissionToastX=-1
MissionToastY=-1
; ARRANGE CARDS toolbar: offset from its default spot (1080p units), set by dragging it
ArrangeBarX=0
ArrangeBarY=0

[UI]
; v0.34: 1 = the module status card on the SCANNER / COMMS tabs is folded to one line (click it in F11)
ModuleNoteCompact=0

[Comms]
; Horizon Comms module (hudmessagesmenu + dialoguemenu patches). Set in F11 > COMMS.
; Horizon subtitle card (0 = the game's subtitles, or another mod's)
Subtitles=1
; 1 = pause Horizon subtitles while another mod that changes subtitles is installed
SubAutoPause=1
; 0.70 - 1.80, times [Style] TextScale (v0.34: smaller base card; about 1.15 = the old default size)
SubSize=1.00
; card width, % of 1920 (30 - 90)
SubWidth=50
SubBgOpacity=0.70
; 0 bottom center, 1 lower third, 2 top center (ignored once SubtitleX/Y in [Layout] are set)
SubPosition=0
; -300 - 300, 1080p units, + moves the card up (added to the default spot or the ARRANGE position)
SubOffsetY=0
; 0 left, 1 center
SubAlign=0
; subtitle text: -1 off-white, 0 - 12 accent palette, 13 = SubTextHex (the speaker name keeps SpeakerColor)
SubTextColor=-1
SubTextHex=
; 1 card behind the subtitles, 0 text only (soft dark outline)
SubCard=1
; -600 - 600, 1080p units, + moves the card right (added to the default spot or the ARRANGE position)
SubOffsetX=0
ShowSpeaker=1
; -1 accent, 0 - 12 accent palette, 13 = SpeakerHex
SpeakerColor=-1
SpeakerHex=
SpeakerCard=1
KeepInDialogue=1
FixedInDialogue=1
; 2 - 5: a longer line first widens the card (up to 90 %), then the card grows; the text size never changes
SubMaxLines=3
; -1 global FontFace, 1 Exo 2, 2 Roboto, 0 game font, 3 game font (semibold)
SubFont=-1
; written by every F11 save; the Comms movies re-apply when it changes
HzRev=0
; ---- mission toast ----
; Horizon mission updated toast in place of the game's quest banner
MissionToast=1
; seconds each toast stays (2 - 15)
MissionToastTime=5
; toasts stacked at once (1 - 5), newest on top
MissionToastMax=3
; 1 = the game's quest sound plays (it is played by the game's banner; 0 is not supported yet)
MissionToastSound=1
; toast size: -1 = [Style] HudScale (GLOBAL), 0.60 - 1.60 = its own size (TextScale applies on top)
MissionToastScale=-1
; ---- companion reactions ----
; Horizon card for the companion reaction line (Name liked that.): 0 = the game's line. English game text only; any other line stays the game's
ReactionCard=1
; ---- dialogue ----
; Horizon dialogue list (needs the Horizon dialogue file; applies from the next conversation)
Dialogue=1
; 1 = pause the Horizon dialogue list while another mod that changes the dialogue menu is installed
DlgAutoPause=1
; 0 card list, 1 compact, 2 classic centered
DlgLayout=0
; options shown before scrolling: 0 = all (the card fits them), 1 - 12
DlgVisible=0
DlgMoreHint=1
DlgTextSize=1.00
DlgFont=-1
DlgBgOpacity=0.85
; 1 panel behind the dialogue list, 0 text only
DlgCard=1
; -600 - 600, 1080p units, + moves the panel right (added to the default spot or the ARRANGE position)
DlgOffsetX=0
; -400 - 400, 1080p units, + moves the panel up (added to the default spot or the ARRANGE position)
DlgOffsetY=0
; window size 0.70 - 1.50 (width, padding and text); DlgTextSize multiplies the option text on top. If all options do not fit the screen height the option text steps down (to 0.7 x)
DlgScale=1.00
; panel color: 0 slate, 1 graphite, 2 navy, 3 deep teal, 4 plum, 5 crimson, 6 storm gray, 7 light gray, 8 white, 9 pale blue, 10 pale amber, 11 pale mint, 12 = DlgBgHex
DlgBgColor=0
DlgBgHex=
; option text: -1 off-white (dark text on light panels), 0 - 12 accent palette, 13 = DlgTextHex
DlgTextColor=-1
DlgTextHex=
DlgNumberKeys=1
DlgWheel=1
DlgHoverScroll=0
; 0 dimmed, 1 hidden, 2 tagged
DlgSaidStyle=2
; 0 chip, 1 colored text, 2 none; DlgPersuadeColor = accent palette index
DlgPersuadeStyle=0
DlgPersuadeColor=2
; 1 = Horizon persuasion meter (score, the highlighted reply, turns). 0 = the game's meter
DlgPersuasionMeter=1
DlgMarkers=0
; ms before a list accepts input (game default 1000)
DlgInputDelay=150
; 0 game default, 1 off
DlgRolloverSound=0
; 0 off, 1 fast, 2 vanilla-like
DlgAnim=1
; dialogue key bar: 0 Horizon (under the card), 1 the game's bar, 2 hidden (keys still work)
DlgButtonBar=0
; 1 = '1 - 9 QUICK PICK' hint on the Horizon bar (keyboard, with DlgNumberKeys=1)
DlgQuickPickHint=1
; 1 = SELECT key on the Horizon bar (keyboard)
DlgSelectHint=1

[Scanner]
; Horizon Scanner module. Read when the hand scanner opens; set in F11 > SCANNER from the main HUD (F11 does not open inside the scanner).
; Layout version (written by the HUD; do not edit)
ScanLayoutVersion=1
; ---- panels: 1 = shown, 0 = hidden (the other panels of a stack close up) ----
ScanShowPlanet=1
ScanShowBioscan=1
ScanShowSignals=1
ScanShowTraits=1
ScanShowCompass=1
ScanShowMode=1
ScanShowHints=1
; 1 = name tag next to the picked object; ScanWorldMarkers = markers on points of interest in the view (0 also hides the HUD's floating quest markers while scanning)
ScanShowWorldTags=1
ScanWorldMarkers=1
; 1 = body type (planet, moon, ...) after the system name in the planet card
ScanShowBodyType=0
; 1 = YOUR SHIP and YOUR VEHICLE rows in the signals list (only when the game gives the distance); 0 = your own ship and vehicle are left out of the signals list
ScanShowShip=1
; ---- positions: -1 = default spot, L/R/C+n (X) and T/B/C+n (Y) = 1080p units from that screen edge or the center, inside the edge distance ----
; (set here, by a preset or with F11 > SCANNER > ARRANGE SCANNER)
ScanPlanetX=-1
ScanPlanetY=-1
ScanBioscanX=-1
ScanBioscanY=-1
ScanSignalsX=-1
ScanSignalsY=-1
ScanTraitsX=-1
ScanTraitsY=-1
; ScanSocialX / ScanSocialY / ScanSocialScale = the social strip (social skills, bounty) shown instead of the traits card while you scan someone (-1 = the traits card's spot / size)
ScanSocialX=-1
ScanSocialY=-1
ScanCompassX=-1
ScanCompassY=-1
ScanModeX=-1
ScanModeY=-1
ScanHintsX=-1
ScanHintsY=-1
; ScanVitalsX / ScanVitalsY = the vitals the HUD keeps while scanning (-1 = bottom center)
ScanVitalsX=-1
ScanVitalsY=-1
; ---- sizes: -1 = [Style] HudScale (GLOBAL), 0.60 - 1.60 = this panel's own size ----
; (the text scales with the panel, as on the HUD cards: below 1.00 it draws under 13 px at 1080p, about 10.4 px at 0.80)
ScanPlanetScale=-1
ScanBioscanScale=-1
ScanSignalsScale=-1
ScanTraitsScale=-1
ScanSocialScale=-1
ScanCompassScale=-1
ScanModeScale=-1
ScanHintsScale=-1
; World tag size (-1 = GLOBAL); the tag follows the picked object, so it has no position keys
ScanWorldTagScale=-1
; ---- compact form: -1 = ScanCompactAll, 0 = full card, 1 = slim strip ----
ScanPlanetCompact=-1
ScanBioscanCompact=-1
ScanSignalsCompact=-1
ScanTraitsCompact=-1
ScanCompassCompact=-1
; Compact all panels: -1 = [Style] Compact (GLOBAL), 0 = off, 1 = on
ScanCompactAll=-1
; ---- look ----
; Panel opacity: -1 = [Style] CardOpacity, 0.20 - 1.60
ScanOpacity=-1
; Accent color: -1 = the HUD accent, 0 - 12 accent palette, 13 = ScanAccentHex (#RRGGBB)
ScanAccent=-1
ScanAccentHex=
; Text case of Horizon's own labels: -1 = [Style] HeaderStyle, 0 = CAPS, 1 = Title (game names are never re-cased to Title)
ScanTextCase=-1
; Font: -1 = [Style] FontFace, 1 Exo 2, 2 Roboto, 0 game font, 3 game font (semibold)
ScanFont=-1
; Edge distance: -1 = [Style] Margin, 20 - 200 (1080p units)
ScanMargin=-1
; Distances: 0 = auto (m / km), 1 = meters only
ScanUnits=0
; ---- lists and alerts ----
; Signals listed (1 - 8); the quest objective row is always kept
ScanMaxSignals=5
; Hazard rows of the planet card: amber at this exposure % (5 - 95), red at ScanHazardCrit (10 - 100, at least amber + 5)
ScanHazardWarn=50
ScanHazardCrit=85
; ---- extras ----
; 1 = the bioscan card flashes green when a scan is complete
ScanCompleteFlash=1
; 1 = 'N FAUNA LEFT / N FLORA LEFT' (planet totals) under the bioscan rows
ScanLeftToFind=1
; Resources listed: 0 all, 1 uncommon and up, 2 rare and up, 3 exotic and up, 4 unique only
ScanMinRarity=0
; 1 = highlight the nearest undiscovered signal in the signals list
ScanNearestUnscanned=1
; ---- main HUD ----
; 1 = hide the Horizon HUD cards while the Horizon scanner is open (needs the Scanner module). The item card, container list,
; activate prompt and combat feedback always stay. Whatever this is set to, the vanilla bottom-left planet name / type always
; hides while scanning, and the floating quest markers hide while scanning only when ScanWorldMarkers=0 (POI MARKERS off).
HideMainHudWhileScanning=1
; Vitals kept on screen while HideMainHudWhileScanning hides the HUD: 1 = shown, 0 = hidden
; (health, O2, boost; these replace ScanShowVitals: an old ScanShowVitals=0 still turns all three off)
ScanShowVitalsHealth=1
ScanShowVitalsO2=1
ScanShowVitalsBoost=1
; Kept vitals form: 0 = full card, 1 = slim strip
ScanVitalsCompact=0
; Kept vitals layout: 0 = vertical stack (one stat per row), 1 = horizontal row
ScanVitalsLayout=0
; ---- scanner popups (done by the Comms HUD Messages file) ----
; 1 = hide quest popups and the mission toast for the whole scan
HideQuestPopupsWhileScanning=1
; 1 = dim the trait popup while scanning; TraitPopupDim = its opacity (0.10 - 0.90)
DimTraitPopupDuringBioscan=0
TraitPopupDim=0.40

[Scope]
; Horizon Scope module (optional: scopemenu.swf / scopemenu_lrg.swf). Read when a scope opens; set in F11 > CARDS and ARRANGE CARDS.
; 1 = the hold-breath prompt is a Horizon chip (target icon, label, O2 meter; the game's prompt is hidden, never removed),
; 0 = the game's own prompt
ScopeHoldBreathChip=1
; chip spot: offset from the game's prompt in 1080p units (X + = right, Y + = up; -900 - 900 / -500 - 500); 0 / 0 = the game's spot
ScopeChipX=0
ScopeChipY=0
; chip size 0.60 - 1.60 (1 = the game's prompt size)
ScopeChipScale=1

[Debug]
; 1 shows a live data readout (for troubleshooting, incl. per-marker compass list/type/heading; numbers under compass icons)
Debug=0
