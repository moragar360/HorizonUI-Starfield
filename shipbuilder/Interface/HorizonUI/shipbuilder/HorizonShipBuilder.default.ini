; Horizon Ship Builder defaults. The game does not write this file.
; The player file is Documents\My Games\Starfield\Data\Interface\HorizonUI\shipbuilder\HorizonShipBuilder.user.ini
; A key equal to the default is left out of the player file.

[Style]
; 9 is gold. 0 through 12 are the swatches. 13 is AccentHex. -1 follows the HUD accent file when it is present.
AccentColor=9
AccentHex=

[Layout]
ScreenMargin=34

[Arrange]
; -1 is the mock spot. X is L, R, or C. Y is T, B, or C. The number is a 1080p offset from the margin.
PowerX=-1
PowerY=-1
ModuleX=-1
ModuleY=-1
CreditsX=-1
CreditsY=-1
BrowserX=-1
BrowserY=-1
StatsX=-1
StatsY=-1
HintsX=-1
HintsY=-1
ClusterX=-1
ClusterY=-1
ArrangeBarX=0
ArrangeBarY=0

[Keys]
; Ctrl+L opens Arrange. 0 turns that key off. The gear button stays.
Arrange=L

[Debug]
; 1 shows the old probe overlay and the F6, F7, and F8 keys. Leave this at 0.
Probe=0
