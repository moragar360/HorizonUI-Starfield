; Horizon Ship Builder defaults. The game does not write this file.
; The player file is Documents\My Games\Starfield\Data\Interface\HorizonUI\shipbuilder\HorizonShipBuilder.user.ini
; Settings and Arrange write the player file. A key equal to the default is left out of it.

[Style]
; 9 is gold (#E8C547). 0 through 12 are the swatches. 13 is AccentHex. -1 follows the HUD accent file when it is present.
AccentColor=9
AccentHex=
; Panel opacity, 0.40 to 1.00.
CardOpacity=1.00

[Layout]
ScreenMargin=34
; Text and panel scale, 0.80 to 1.30.
UiScale=1.00
; compact or detailed rows in the parts browser.
Density=compact
GroupByMaker=0
; 1 keeps a collapsed panel collapsed the next time the builder opens.
RememberLayout=1

[Panels]
; 0 starts a panel collapsed.
Power=1
Module=1
Credits=1
Browser=1
Stats=1
Hints=1

[Notices]
; 0 hides the notice shown when StarUI Ship Builder files are present.
ShowConflictNotice=1

[Columns]
; Written by the column chooser, one line per category: the shown columns, and
; <category>Sort with a column name (a trailing - sorts high to low). No line means the default.

[Arrange]
; -1 is the mock spot. X is L, R, or C. Y is T, B, or C. The number is a 1080p offset from the margin.
PowerX=-1
PowerY=-1
ModuleX=-1
ModuleY=-1
CreditsX=-1
CreditsY=-1
BrowserX=-1
BrowserY=-1
StatsX=-1
StatsY=-1
HintsX=-1
HintsY=-1
ClusterX=-1
ClusterY=-1
ArrangeBarX=0
ArrangeBarY=0

[Keys]
; Ctrl+L opens Arrange. 0 turns that key off. The gear button stays.
Arrange=L
; One key each, set in Settings. 0 turns it off. A key the game uses in this menu is ignored.
HideAll=H
Find=/

[Debug]
; 1 shows the probe overlay and its F6, F7, and F8 keys. Leave this at 0.
Probe=0
; 1 draws the private font strip along the top of the builder. Leave this at 0.
; The private test package rewrites the installed copy of this file to FontStrip=1.
; A public package does not. The player file can set either value and it wins.
FontStrip=0
